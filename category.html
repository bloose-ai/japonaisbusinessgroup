<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="512x512" href="/images/jbg-favicon-512.png">
<title id="shopTitleTag">Shop | JBG - Japonais Business Group</title>
<meta name="description" content="Browse home, bathroom, lighting, plumbing, electronics, and safety products from Japonais Business Group in Rwanda." />
<link rel="canonical" href="https://www.japonaisbusinessgroup.com/category.html" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="topbar">
    <div class="container">
      <a href="/" class="logo">
        <img src="images/logo-icon.png" alt="JBG - Japonais Business Group logo">
        <span class="name">JAPONAIS<b>BUSINESS GROUP</b></span>
      </a>
      <form class="search-bar" id="shopSearchForm">
        <input type="text" id="shopSearchInput" placeholder="Search for products...">
        <button type="submit" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
      </form>
      <div class="top-actions">
        <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> My Account</a>
        <a href="cart.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg> Cart (<span id="cartCount">0</span>)</a>
      </div>
    </div>
  </div>
  <nav class="navbar">
    <div class="container">
      <div class="all-cats">
        <button class="mobile-toggle" id="navToggle" aria-label="Toggle menu">&#9776;</button>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        <span class="label">ALL CATEGORIES</span>
      </div>
      <ul class="nav-links" id="navLinks">
        <li><a href="/">HOME</a></li>
        <li><a href="category.html" class="active">SHOP</a></li>
        <li><a href="about.html">ABOUT US</a></li>
        <li><a href="blog.html">BLOG</a></li>
        <li><a href="contact.html">CONTACT US</a></li>
      </ul>
    </div>
  </nav>
</header>

<div class="page-head">
  <h1 id="shopHeading">Shop</h1>
  <div class="crumb" id="shopCrumb"><a href="/">Home</a> &gt; Shop</div>
</div>

<div class="container">
  <div class="shop-layout">
    <aside class="filters">
      <div class="filter-group">
        <div class="filter-group-head">
          <h3>CATEGORIES</h3>
          <button type="button" id="clearFilters" class="clear-filters">Clear all</button>
        </div>
        <ul class="check-list cat-filter-list" id="catFilterList">
          <!-- category checkboxes injected by js/main.js -->
        </ul>
      </div>

      <div class="filter-group">
        <h4>PRICE</h4>
        <div class="price-inputs">
          <label>Min<input type="number" id="priceMin" min="0" step="1" placeholder="0"></label>
          <label>Max<input type="number" id="priceMax" min="0" step="1" placeholder="2000"></label>
        </div>
        <input type="range" id="priceRange" min="0" max="2000" step="5" value="2000">
        <div class="range-labels"><span id="priceRangeLabel">Up to $2,000</span></div>
      </div>
    </aside>

    <div>
      <div class="shop-toolbar">
        <span id="resultCount" style="font-size:13px;color:var(--gray-text);">Showing results</span>
        <select id="sortSelect">
          <option value="newest">Sort by: Newest</option>
          <option value="price-asc">Sort by: Price Low-High</option>
          <option value="price-desc">Sort by: Price High-Low</option>
        </select>
      </div>

      <div class="prod-grid" id="prodGrid">
        <!-- products injected by js/main.js -->
      </div>
    </div>
  </div>
</div>

<footer class="footer" id="site-footer"></footer>

<script src="js/analytics.bundle.js"></script>
<script src="js/main.js"></script>
</body>
</html>
